services:
  db:
    image: postgres:15-alpine
    container_name: farmacia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: farmacia_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  web:
    build: .
    container_name: farmacia_web
    command: gunicorn farmacia.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: farmacia_celery_worker
    command: celery -A farmacia worker --loglevel=INFO
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: farmacia_celery_beat
    command: celery -A farmacia beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      celery_worker:
        condition: service_started
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: farmacia_inclusiva_ngrok
    command: http web:8000 --url https://flagship-hacking-amino.ngrok-free.dev
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
